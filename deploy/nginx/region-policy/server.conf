# Include once in each public server {}. Copy the HTML file to the root below.
# Keep the URI form of error_page: =200 (or = without a code) loses HTTP 451.
error_page 451 /__region_unavailable.html;

location = /__region_unavailable.html {
    internal;
    root /srv/www/sub2api-region-policy;
    types { }
    default_type text/html;
    charset utf-8;
    etag off;
    if_modified_since off;

    # Explicitly repeat security headers: local add_header disables inheritance.
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
